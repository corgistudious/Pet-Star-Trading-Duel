name: Backend & data checks

on:
  push:
    paths: ["backend/**", "shared-contracts/**", "database/**", "tools/**", "client-unity/**", ".github/workflows/backend.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petstar
          POSTGRES_PASSWORD: petstar_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petstar" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PETSTAR_TEST_PG: "Host=localhost;Port=5432;Username=petstar;Password=petstar_ci_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore & build
        working-directory: backend
        run: dotnet build -c Release
      - name: Rules unit tests
        working-directory: backend
        run: dotnet test tests/PetStar.Rules.Tests -c Release --no-build --logger "trx;LogFileName=rules.trx"
      - name: API integration & security tests (PostgreSQL)
        working-directory: backend
        run: dotnet test tests/PetStar.Api.Tests -c Release --no-build --logger "trx;LogFileName=api.trx"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Localization coverage (en/vi)
        run: python tools/check_localization.py
      - name: Unity asset pre-check (files the Unity build needs)
        run: python tools/check_unity_assets.py
      - name: Unity scripts syntax check (C# 9)
        run: |
          dotnet run --project tools/unity-syntax-check -- client-unity/Assets/Scripts
          dotnet run --project tools/unity-syntax-check -- client-unity/Assets/Editor
          dotnet run --project tools/unity-syntax-check -- shared-contracts/Runtime
      - name: Unity semantic compile check (real UnityEngine/UnityEditor reference DLLs; not a Unity build)
        run: tools/unity-compile-check/run.sh
      - name: Migrations are in sync with the model
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/PetStar.Api || (echo "Model changed without a migration" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/tests/**/TestResults/*.trx

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t petstar-api:${{ github.sha }} .
