name: Deploy API to VPS (manual, approval required)

# Never runs automatically. Builds the API image, publishes it to GHCR, then (after the "production"
# environment approval) SSHes to the VPS and runs deployment/vps/deploy.sh, which touches ONLY the
# petstar-prod compose project. Required configuration (all in GitHub settings, never in the repo or chat):
#   environment "production": required reviewers = the owner
#   secrets : VPS_HOST, VPS_USER, VPS_SSH_KEY (dedicated deploy key), VPS_KNOWN_HOSTS (output of ssh-keyscan)
#   variable: VPS_REPO_DIR (checkout on the VPS, e.g. /opt/petstar/repo)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deployment'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/petstar-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f backend/Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy petstar-prod
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          REPO_DIR: ${{ vars.VPS_REPO_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s -- "$IMAGE" "$REPO_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; REPO_DIR="$2"; SHA="$3"
          cd "$REPO_DIR"
          git fetch --quiet origin && git checkout --quiet "$SHA"
          sed -i "s#^PETSTAR_API_IMAGE=.*#PETSTAR_API_IMAGE=$IMAGE#" /opt/petstar/petstar.env
          bash deployment/vps/deploy.sh /opt/petstar/petstar.env
          REMOTE
